<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maa Kali CSC Portal</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f9;
        }

        .header {
            background: #1a73e8;
            color: white;
            text-align: center;
            padding: 25px 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin-top: 8px;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        input {
            width: 90%;
            padding: 14px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1557b0;
        }

        #result {
            margin-top: 20px;
        }

        .pdf-button {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 10px;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Maa Kali CSC Portal</h1>
        <p>RS Number से Certificate Search करें</p>
    </div>

    <div class="container">

        <h2>Certificate Search</h2>

        <p>अपना RS Number दर्ज करें</p>

        <input
            type="text"
            id="rsNumber"
            placeholder="उदाहरण: RS/419/0110/51674/2025"
        >

        <br>

        <button onclick="searchCertificate()">
            Search
        </button>

        <div id="result"></div>

    </div>

    <div class="footer">
        © 2026 Maa Kali CSC Centre
    </div>


    <script>

        function searchCertificate() {

            let rsNumber =
                document.getElementById("rsNumber").value.trim();

            let result =
                document.getElementById("result");


            if (rsNumber === "") {

                result.innerHTML =
                    '<p class="error">कृपया RS Number दर्ज करें।</p>';

                return;
            }


            // आपके PDF का RS Number
            let correctRS =
                "RS/419/0110/51674/2025";


            if (rsNumber === correctRS) {

                result.innerHTML =

                    '<p class="success">Certificate मिल गया!</p>' +

                    '<a class="pdf-button" ' +

                    'href="certificate.pdf" ' +

                    'target="_blank">' +

                    '📄 PDF देखें / Download करें' +

                    '</a>';

            }

            else {

                result.innerHTML =

                    '<p class="error">' +

                    'इस RS Number का Certificate उपलब्ध नहीं है।' +

                    '</p>';

            }

        }

    </script>

</body>
</html>
